<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>清運調度台</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#111;background:#f6f7f9}
  header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#14352a;color:#fff}
  header h1{font-size:17px;margin:0;flex:1}
  main{display:grid;grid-template-columns:1fr 420px;gap:12px;padding:12px;height:calc(100vh - 50px)}
  @media(max-width:900px){main{grid-template-columns:1fr;height:auto}#map{height:55vh}}
  #map{border-radius:12px;min-height:300px}
  aside{overflow:auto;display:flex;flex-direction:column;gap:12px}
  .card{background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .card h2{font-size:14px;margin:0 0 8px}
  .kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
  .kpi b{display:block;font-size:20px}
  .kpi span{font-size:12px;color:#666}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{padding:5px 4px;border-bottom:1px solid #eee;text-align:left}
  .pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;color:#fff}
  tr.warn td{background:#fdecea}
  label{font-size:13px;margin-right:8px}
  input{width:64px}
  button{padding:7px 12px;border:0;border-radius:8px;background:#1f6f4a;color:#fff;font-weight:600;cursor:pointer}
  button.ghost{background:#eee;color:#111}
  ol{padding-left:20px;margin:6px 0;font-size:13px}
  #bins tr[data-id]{cursor:pointer}
  #bins tr.sel td{outline:2px solid #1f6f4a;outline-offset:-2px}
  .hist-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .hist-head h2{margin:0;flex:1}
  .hist-head button{padding:4px 9px;font-size:12px}
  .hist-head button.on{background:#1f6f4a;color:#fff}
  #hist-wrap{position:relative;height:220px}
  #hist-now{font-size:12px;color:#444;margin:6px 0 0}
</style>
</head>
<body>
<header><h1>Smart Bin 清運調度台</h1><button class="ghost" id="logout">登出</button></header>
<main>
  <div id="map"></div>
  <aside>
    <div class="card">
      <h2>動態派車</h2>
      <label>車輛 <input id="veh" type="number" value="1" min="1" max="10"></label>
      <label>容量(L) <input id="cap" type="number" value="2000" step="100"></label>
      <label>預測(h) <input id="hz" type="number" value="4" step="0.5"></label>
      <button id="plan">產生路線</button>
      <div class="kpi" id="kpi" style="margin-top:10px"></div>
      <div id="routes"></div>
    </div>
    <div class="card"><h2>事件</h2><table id="events"></table></div>
    <div class="card"><h2>垃圾桶狀態 <small style="font-weight:400;color:#666">點一列看時間序列</small></h2><table id="bins"></table></div>
    <div class="card">
      <div class="hist-head"><h2 id="hist-title">感測數據</h2>
        <button class="ghost" data-h="1">1 小時</button><button class="ghost" data-h="6">6 小時</button><button class="ghost" data-h="24">24 小時</button></div>
      <div id="hist-wrap"><canvas id="hist"></canvas></div>
      <p id="hist-now"></p>
    </div>
  </aside>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/chart.js@4.4.1/dist/chart.umd.js"></script>
<script>
const C={available:'#1f6f4a',near_full:'#c98a00',full:'#c0392b',offline:'#6b7280',fault:'#7c3aed'};
const STATE={available:'有空位',near_full:'快滿',full:'已滿',offline:'離線',fault:'感測被擋'};
const EVT={overflow:'桶滿外溢',illegal_dumping:'違規傾倒',bag_rejected:'拒收垃圾袋',sensor_blocked:'感測器遮擋',
  ground_waste:'地面垃圾',ground_waste_unknown:'地面垃圾',fire_smoke:'煙霧',tamper:'破壞'};
const warn=b=>(b.open_events||[]).map(t=>EVT[t]||t).join('、');  // 未處理事件 → 桶要顯示警示
const VCOL=['#2563eb','#db2777','#ea580c','#0891b2','#65a30d'];
let TOKEN=sessionStorage.getItem('adm')||prompt('Admin token');
sessionStorage.setItem('adm',TOKEN);
document.getElementById('logout').onclick=()=>{sessionStorage.removeItem('adm');location.reload()};
const H={'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ?demo=1：現場 Demo 用，每 5 秒更新並把地圖移到 NTNU-01（?bin= 可換桶）；平常 30 秒
const Q=new URLSearchParams(location.search), DEMO=Q.get('demo')==='1', FOCUS=Q.get('bin')||'NTNU-01';
let focused=false;
const ago=t=>{if(t==null)return'-';const s=Math.max(0,Date.now()/1000-t);
  return s<60?`${Math.round(s)} 秒前`:s<3600?`${Math.floor(s/60)} 分前`:new Date(t*1000).toLocaleString()};

const map=L.map('map').setView([25.0215,121.5310],15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const binLayer=L.layerGroup().addTo(map), routeLayer=L.layerGroup().addTo(map);

async function loadBins(signal){
  const r=await fetch('/api/admin/bins',{headers:H,signal});
  if(!r.ok) return;  // token 錯誤由 loadEvents 提示並重新登入
  const bins=await r.json();
  if(signal.aborted) return;
  binLayer.clearLayers();
  if(DEMO&&!focused){
    const f=bins.find(b=>b.id===FOCUS);
    if(f){map.setView([f.lat,f.lng],17);focused=true}
  }
  if(!histBin) histBin=(bins.find(b=>b.id===FOCUS)||bins[0])?.id||null;
  binsById=Object.fromEntries(bins.map(b=>[b.id,b]));
  document.getElementById('bins').innerHTML='<tr><th>ID</th><th>位置</th><th>狀態</th><th>%</th><th>重量(g)</th><th>距離(cm)</th><th>遮擋</th><th>滿前(h)</th><th>最後上傳</th></tr>'+
    bins.map(b=>`<tr data-id="${esc(b.id)}" class="${warn(b)?'warn':''}${b.id===histBin?' sel':''}"><td>${warn(b)?'⚠ ':''}${esc(b.id)}</td><td>${esc(b.name)}</td><td><span class="pill" style="background:${C[b.state]}">${STATE[b.state]||esc(b.state)}</span></td>
      <td>${b.fill_pct??'-'}</td><td>${b.weight_g??'-'}</td><td>${cm(b.dist_mm)}</td><td>${yn(b.blocked)}</td><td>${b.hours_to_full??'-'}</td><td>${ago(b.last_seen)}</td></tr>`).join('');
  bins.forEach(b=>{const w=warn(b);
    L.circleMarker([b.lat,b.lng],{radius:w?11:8,color:w?'#c0392b':'#fff',weight:w?4:2,fillColor:C[b.state],fillOpacity:.95})
      .bindTooltip(`${esc(b.id)} ${esc(b.name)} ${STATE[b.state]||esc(b.state)} ${b.fill_pct??'-'}%${b.weight_g==null?'':` · ${b.weight_g}g`}`+
        `${b.dist_mm==null?'':` · ${cm(b.dist_mm)} cm`}${b.blocked?' · 遮擋':''}${w?`<br>⚠ ${esc(w)}`:''}`)
      .on('click',()=>selectBin(b.id)).addTo(binLayer)});
}
// ---- 時間序列（#32）
const cm=mm=>mm==null?'-':(mm/10).toFixed(1);
const yn=v=>v==null?'-':v?'是':'否';
let histBin=null, histHours=1, binsById={}, chart=null;
document.getElementById('bins').onclick=e=>{const tr=e.target.closest('tr[data-id]'); if(tr) selectBin(tr.dataset.id)};
document.querySelectorAll('.hist-head button').forEach(btn=>btn.onclick=()=>{histHours=+btn.dataset.h; loadHistory()});
function selectBin(id){
  histBin=id;
  document.querySelectorAll('#bins tr[data-id]').forEach(tr=>tr.classList.toggle('sel',tr.dataset.id===id));
  loadHistory();
}
// 遮擋時段畫成灰底
const blockedBands={id:'blockedBands',beforeDatasetsDraw(c){
  const pts=c.$blocked||[], x=c.scales.x, a=c.chartArea; if(!pts.length) return;
  const ctx=c.ctx; ctx.save(); ctx.fillStyle='rgba(124,58,237,.13)';
  pts.forEach(([t0,t1])=>{const x0=x.getPixelForValue(t0), x1=Math.max(x.getPixelForValue(t1),x0+3);
    ctx.fillRect(x0,a.top,x1-x0,a.bottom-a.top)});
  ctx.restore()}};
function drawHistory(rows){
  const ms=r=>r.ts*1000, pt=f=>rows.map(r=>({x:ms(r),y:f(r)}));
  const bands=[]; let start=null;
  rows.forEach((r,i)=>{if(r.blocked&&start==null) start=ms(r);
    if(start!=null&&(!r.blocked||i===rows.length-1)){bands.push([start,ms(r)]); start=null}});
  const tick=v=>{const d=new Date(v); return histHours>6?`${d.getMonth()+1}/${d.getDate()} ${d.toTimeString().slice(0,5)}`:d.toTimeString().slice(0,5)};
  const data={datasets:[
    {label:'滿度 %',data:pt(r=>r.fill_pct),borderColor:'#1f6f4a',backgroundColor:'#1f6f4a',yAxisID:'pct'},
    {label:'重量 g',data:pt(r=>r.weight_g),borderColor:'#c98a00',backgroundColor:'#c98a00',yAxisID:'g',spanGaps:false},
    {label:'距離 cm',data:pt(r=>r.dist_mm==null?null:r.dist_mm/10),borderColor:'#2563eb',backgroundColor:'#2563eb',yAxisID:'cm',borderDash:[5,4]}]};
  data.datasets.forEach(d=>Object.assign(d,{pointRadius:rows.length>120?0:2,borderWidth:2,tension:.2}));
  if(!chart){
    chart=new Chart(document.getElementById('hist'),{type:'line',data,plugins:[blockedBands],options:{
      animation:false,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{labels:{boxWidth:10,font:{size:11}}},
        tooltip:{callbacks:{title:it=>new Date(it[0].parsed.x).toLocaleString(),
          footer:it=>rows[it[0].dataIndex]?.blocked?'感測器遮擋':''}}},
      scales:{x:{type:'linear',ticks:{callback:tick,maxTicksLimit:6,font:{size:10}}},
        pct:{position:'left',min:0,max:100,title:{display:true,text:'%'}},
        g:{position:'right',beginAtZero:true,title:{display:true,text:'g'},grid:{drawOnChartArea:false}},
        cm:{position:'right',beginAtZero:true,title:{display:true,text:'cm'},grid:{drawOnChartArea:false}}}}});
  }else{chart.data=data; chart.options.scales.x.ticks.callback=tick}
  chart.$blocked=bands;
  chart.update();
}
async function loadHistory(signal){
  document.querySelectorAll('.hist-head button').forEach(b=>b.classList.toggle('on',+b.dataset.h===histHours));
  if(!histBin) return;
  const b=binsById[histBin];
  document.getElementById('hist-title').textContent=`感測數據・${histBin}`;
  document.getElementById('hist-now').textContent=b?`最新：滿度 ${b.fill_pct??'-'}%・重量 ${b.weight_g??'-'} g・距離 ${cm(b.dist_mm)} cm・遮擋 ${yn(b.blocked)}・${ago(b.last_seen)}`:'';
  if(typeof Chart==='undefined'){document.getElementById('hist-now').textContent+='（圖表載入失敗）';return}
  const r=await fetch(`/api/bins/${encodeURIComponent(histBin)}/history?hours=${histHours}`,{headers:H,signal});
  if(!r.ok||signal?.aborted) return;
  const rows=await r.json();
  if(signal?.aborted) return;
  drawHistory(rows);
}
async function loadEvents(signal){
  const r=await fetch('/api/events?limit=30',{headers:H,signal});
  if(signal.aborted) return;
  if(r.status===401){sessionStorage.removeItem('adm');alert('token 錯誤');location.reload();return}
  if(!r.ok) return;
  const ev=await r.json();
  if(signal.aborted) return;
  document.getElementById('events').innerHTML=ev.length?ev.map(e=>`<tr><td>${new Date(e.ts*1000).toLocaleTimeString()}</td>
    <td>${esc(e.bin_id)}</td><td>${EVT[e.type]||esc(e.type)}</td>
    <td>${e.resolved?'✓':`<button class="ghost" onclick="resolve(${e.id})">處理</button>`}</td></tr>`).join(''):'<tr><td>無</td></tr>';
}
let poll=null;
async function refresh(){
  if(poll&&!poll.signal.aborted) return;
  const controller=new AbortController();
  poll=controller;
  const timeout=setTimeout(()=>controller.abort(),15000);
  await Promise.allSettled([loadBins(controller.signal),loadEvents(controller.signal)]);
  if(!controller.signal.aborted) await loadHistory(controller.signal).catch(()=>{});
  clearTimeout(timeout);
  if(poll===controller) poll=null;
}

async function resolve(id){
  try{
    const r=await fetch(`/api/events/${id}/resolve`,{method:'POST',headers:H});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
  }catch{
    alert('事件處理失敗，請再試一次。');
    return;
  }
  poll?.abort();
  refresh();
}

document.getElementById('plan').onclick=async()=>{
  const body={vehicles:+veh.value,vehicle_capacity_l:+cap.value,horizon_h:+hz.value};
  const r=await fetch('/api/dispatch/plan',{method:'POST',headers:H,body:JSON.stringify(body)});
  if(!r.ok){alert(await r.text());return}
  const p=await r.json();
  routeLayer.clearLayers();
  L.marker([p.depot.lat,p.depot.lng]).bindTooltip('清潔隊').addTo(routeLayer);
  const stops=p.routes.reduce((n,x)=>n+x.path.length-2,0);
  document.getElementById('kpi').innerHTML=`<div><b>${(p.total_m/1000).toFixed(1)} km</b><span>動態路線</span></div>
    <div><b>${(p.baseline_m/1000).toFixed(1)} km</b><span>固定排程</span></div>
    <div><b>${p.saving_pct}%</b><span>節省・${stops} 站</span></div>`;
  document.getElementById('routes').innerHTML=p.routes.map(rt=>`<p style="margin:8px 0 0;font-size:13px;color:${VCOL[rt.vehicle%5]}">
    <b>車 ${rt.vehicle+1}</b>・${(rt.distance_m/1000).toFixed(1)} km・載量約 ${rt.load_l} L</p>
    <ol>${rt.path.filter(s=>!s.depot).map(s=>`<li>${esc(s.name)}<br><small>${esc(s.reason)}</small></li>`).join('')}</ol>`).join('')
    +(p.skipped.length?`<p style="font-size:12px;color:#666">未排入：${p.skipped.join(', ')}</p>`:'');
  p.routes.forEach(rt=>{
    L.polyline(rt.path.map(s=>[s.lat,s.lng]),{color:VCOL[rt.vehicle%5],weight:4,opacity:.85}).addTo(routeLayer);
    rt.path.filter(s=>!s.depot).forEach((s,i)=>L.marker([s.lat,s.lng],{icon:L.divIcon({className:'',
      html:`<div style="background:${VCOL[rt.vehicle%5]};color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;font-size:12px;font-weight:700">${i+1}</div>`})}).addTo(routeLayer));
  });
};
refresh();setInterval(refresh,DEMO?5000:30000);
</script>
</body>
</html>
