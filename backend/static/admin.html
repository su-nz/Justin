<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>清運調度台</title>
<meta name="theme-color" content="#14352a">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{--g:#1f6f4a;--y:#c98a00;--r:#c0392b;--k:#6b7280;--p:#7c3aed;--b:#2563eb;
    --bg:#f3f5f7;--card:#fff;--fg:#111827;--muted:#6b7280;--line:#e5e7eb;--soft:#f3f4f6}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--fg);background:var(--bg);font-size:14px}
  header{position:sticky;top:0;z-index:1100;display:flex;align-items:center;gap:10px;padding:10px 16px;background:#14352a;color:#fff}
  header h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header a{color:#cfe9dc;font-size:13px;text-decoration:none;white-space:nowrap}
  .live{font-size:12px;color:#cfe9dc;white-space:nowrap}
  .live i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;margin-right:5px;vertical-align:0}
  .live.stale i{background:#f87171}
  .live b{font-weight:400;opacity:.8}
  #reload{padding:5px 10px;font-size:13px}
  #reload.spin{opacity:.6}
  button{font:inherit;padding:7px 12px;border:0;border-radius:8px;background:var(--g);color:#fff;font-weight:600;cursor:pointer}
  button.ghost{background:var(--soft);color:var(--fg)}
  header button.ghost{background:rgba(255,255,255,.14);color:#fff}

  /* 版面：手機單欄；平板以上地圖在左、資訊在右 */
  .wrap{padding:12px;display:grid;gap:12px;max-width:1500px;margin:0 auto}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .kpi{background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:0 1px 2px rgba(0,0,0,.06);border-left:4px solid var(--line)}
  .kpi b{display:block;font-size:22px;line-height:1.2}
  .kpi span{font-size:12px;color:var(--muted)}
  .main{display:grid;gap:12px;grid-template-columns:1fr}
  .col{display:grid;gap:12px;align-content:start;min-width:0}
  #map{height:42vh;min-height:260px;border-radius:12px;z-index:0}
  @media(min-width:960px){
    .main{grid-template-columns:minmax(0,1.15fr) minmax(380px,1fr)}
    #map{height:calc(100vh - 190px);min-height:480px;position:sticky;top:64px}
  }
  @media(max-width:640px){
    .kpis{grid-template-columns:repeat(3,1fr)}
    .kpi:nth-child(n+4){display:none}
    header .hide-sm{display:none}
  }
  .card{background:var(--card);border-radius:12px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.06);min-width:0}
  .card h2{font-size:15px;margin:0;display:flex;align-items:center;gap:8px}
  .card h2 small{font-weight:400;color:var(--muted);font-size:12px}
  .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .head h2{flex:1}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap}

  /* 焦點桶 */
  .focus-top{display:flex;gap:14px;align-items:center}
  .gauge{--v:0;--c:var(--g);flex:none;width:96px;height:96px;border-radius:50%;
    background:conic-gradient(var(--c) calc(var(--v)*1%),var(--soft) 0);display:grid;place-items:center}
  .gauge>div{width:74px;height:74px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center}
  .gauge b{font-size:22px;line-height:1}
  .gauge span{font-size:11px;color:var(--muted)}
  .stats{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0}
  .stat{background:var(--soft);border-radius:10px;padding:7px 10px}
  .stat span{display:block;font-size:11px;color:var(--muted)}
  .stat b{font-size:16px}
  .seg{display:inline-flex;background:var(--soft);border-radius:8px;padding:2px}
  .seg button{background:transparent;color:var(--fg);padding:4px 10px;font-size:12px}
  .seg button.on{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.12)}
  #hist-wrap{position:relative;height:360px;margin-top:12px}
  @media(max-width:640px){#hist-wrap{height:280px}}
  .note{font-size:12px;color:var(--muted);margin:6px 0 0}

  /* 事件 */
  .events{display:grid;gap:6px;max-height:320px;overflow:auto}
  .ev{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--soft)}
  .ev.open{background:#fdecea}
  .ev .t{font-size:12px;color:var(--muted);white-space:nowrap}
  .ev .m{flex:1;min-width:0}
  .ev .m b{font-size:13px}
  .ev .m small{display:block;color:var(--muted);font-size:12px}
  .ev button{padding:5px 10px;font-size:12px}
  .empty{color:var(--muted);font-size:13px;padding:8px 0}

  /* 桶子清單：卡片，手機也好讀 */
  .filters{display:flex;gap:6px;flex-wrap:wrap}
  .filters button{padding:4px 10px;font-size:12px;background:var(--soft);color:var(--fg)}
  .filters button.on{background:var(--fg);color:#fff}
  .bins{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .bin{border:1.5px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;background:var(--card);text-align:left;color:inherit;font-weight:400}
  .bin:hover{border-color:#cbd5e1}
  .bin.sel{border-color:var(--g);box-shadow:0 0 0 2px rgba(31,111,74,.18)}
  .bin.warn{background:#fff7f6;border-color:#f3c5bf}
  .bin .r1{display:flex;align-items:center;gap:6px}
  .bin .r1 b{flex:1;font-size:14px}
  .bin .nm{font-size:12px;color:var(--muted);margin:2px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%}
  .bin .r3{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;gap:6px}
  .bin .r3 b{color:var(--fg)}

  /* 派車 */
  .form{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:8px;align-items:end}
  .form label{font-size:12px;color:var(--muted);display:grid;gap:3px}
  .form input{font:inherit;width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
  @media(max-width:420px){.form{grid-template-columns:repeat(3,1fr)}.form button{grid-column:1/-1}}
  .routekpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:12px}
  .routekpi div{background:var(--soft);border-radius:10px;padding:8px}
  .routekpi b{display:block;font-size:18px}
  .routekpi span{font-size:12px;color:var(--muted)}
  ol{padding-left:20px;margin:6px 0;font-size:13px}
  /* 遠端控制（#41） */
  .ctl{display:grid;gap:8px;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .ctl .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .ctl .row>span{font-size:12px;color:var(--muted);width:56px;flex:none}
  .ctl button{padding:6px 10px;font-size:13px}
  .ctl button.warn{background:var(--r)}
  .ctl button.alt{background:var(--b)}
  .ctl .seg button{padding:5px 10px}
  .ctl .seg button.on{background:var(--fg);color:#fff;box-shadow:none}
  .why{margin-top:10px;padding:8px 10px;border-radius:10px;background:var(--soft);font-size:13px;display:flex;gap:8px;align-items:center}
  .why b{font-weight:600}
  .why.lock{background:#fdecea;color:#991b1b}
  .why.open{background:#e8f5ee;color:#14532d}
  .ctl input{font:inherit;flex:1;min-width:120px;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
  .cmds{display:grid;gap:4px;font-size:12px;max-height:150px;overflow:auto}
  .cmds div{display:flex;gap:6px;align-items:baseline}
  .cmds .st{font-weight:600;white-space:nowrap}
  .cmds .rs{color:var(--muted);flex:1;min-width:0}
  /* 元件狀態（#53） */
  .dev{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
  .tile{border-radius:10px;padding:8px 10px;background:var(--soft);border-left:4px solid var(--k)}
  .tile .h{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .tile .h i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
  .tile b{display:block;font-size:14px;margin-top:2px}
  .tile small{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
  .tile.ok{border-left-color:var(--g)} .tile.ok .h{color:var(--g)}
  .tile.warn{border-left-color:var(--y)} .tile.warn .h{color:var(--y)}
  .tile.bad{border-left-color:var(--r)} .tile.bad .h{color:var(--r)}
  .tile.off{border-left-color:var(--k)} .tile.off .h{color:var(--k)}
  .vision{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px;align-items:start}
  @media(max-width:520px){.vision{grid-template-columns:1fr}}
  .vision svg{width:100%;aspect-ratio:4/3;background:#0f172a;border-radius:10px;display:block}
  .vision ul{margin:0;padding:0;list-style:none;font-size:13px;display:grid;gap:4px}
  .vision li{display:flex;justify-content:space-between;gap:8px;background:var(--soft);border-radius:8px;padding:5px 8px}
</style>
</head>
<body>
<header>
  <h1>Smart Bin 清運調度台</h1>
  <span class="live" id="live"><i></i>連線中…</span>
  <button class="ghost" id="reload" title="立刻重新整理">↻<span class="hide-sm"> 重新整理</span></button>
  <a href="/static/flow.html" class="hide-sm">系統流程圖</a>
  <a href="/" class="hide-sm">市民地圖</a>
  <button class="ghost" id="logout">登出</button>
</header>
<div class="wrap">
  <div class="kpis" id="kpis"></div>
  <div class="main">
    <div id="map"></div>
    <div class="col">
      <section class="card" id="focus">
        <div class="head">
          <h2 id="f-title">感測數據</h2>
          <span id="f-pill"></span>
        </div>
        <div class="focus-top">
          <div class="gauge" id="f-gauge"><div><b id="f-fill">--</b><span>滿度</span></div></div>
          <div class="stats">
            <div class="stat"><span>重量</span><b id="f-weight">--</b></div>
            <div class="stat"><span>超音波距離</span><b id="f-dist">--</b></div>
            <div class="stat"><span>預測多久滿</span><b id="f-htf">--</b></div>
            <div class="stat"><span>最後上傳</span><b id="f-seen">--</b></div>
          </div>
        </div>
        <p class="note" id="f-note"></p>
        <div class="head" style="margin:12px 0 0">
          <h2 style="font-size:13px">歷史曲線 <small>紫色底＝感測器被擋</small></h2>
          <div class="seg" id="range"><button data-h="0.16666667">10 分鐘</button><button data-h="1">1 小時</button><button data-h="6">6 小時</button><button data-h="24">24 小時</button></div>
        </div>
        <div id="hist-wrap"><canvas id="hist"></canvas></div>
        <div class="dev">
          <h2 style="font-size:13px">元件狀態 <small id="dev-age"></small></h2>
          <div class="why" id="why" hidden></div>
          <div class="tiles" id="tiles"></div>
          <div class="vision">
            <div><svg id="vis" viewBox="0 0 400 300" role="img" aria-label="相機辨識示意圖（非影像）"></svg>
              <p class="note" id="vis-note">相機辨識示意圖：只顯示辨識結果，不傳影像</p>
              <button class="ghost" id="snap-btn" style="margin-top:6px;padding:5px 10px;font-size:12px">📷 開始傳即時照片</button></div>
            <div><h2 style="font-size:13px;margin-bottom:6px">相機最後看到 <small id="vis-age"></small></h2><ul id="vis-list"></ul></div>
          </div>
        </div>
        <div class="ctl" id="ctl">
          <h2 style="font-size:13px">遠端控制 <small>指令約 2 秒內送達 Pi</small></h2>
          <div class="row"><span>擋板</span>
            <button data-cmd="gate_open">開門</button><button data-cmd="gate_close" class="ghost">關門</button>
            <button data-cmd="gate_reject" class="warn">測試拒收</button></div>
          <div class="row"><span>閘門策略</span>
            <div class="seg" id="policy"><button data-cmd="gate_policy" data-policy="auto">自動</button><button data-cmd="gate_policy" data-policy="force_open">強制開啟</button><button data-cmd="gate_policy" data-policy="force_lock">強制鎖定</button></div></div>
          <div class="row"><span>閘門模式</span>
            <button data-cmd="gate_mode" data-mode="mock" class="ghost">劇本</button>
            <button data-cmd="gate_mode" data-mode="camera" class="alt">相機即時辨識</button></div>
          <div class="row"><span>LCD</span>
            <input id="lcd-text" maxlength="32" placeholder="英數字，最多 32 字（LCD 不支援中文）">
            <button data-cmd="lcd_text">顯示</button></div>
          <div class="row"><span>感測</span>
            <button data-cmd="measure_now" class="ghost">立即量測</button>
            <button data-cmd="tare" class="ghost">秤重歸零</button></div>
          <div class="cmds" id="cmds"></div>
        </div>
      </section>

      <section class="card">
        <div class="head"><h2>事件 <small id="ev-count"></small></h2></div>
        <div class="events" id="events"></div>
      </section>

      <section class="card">
        <div class="head">
          <h2>垃圾桶 <small>點一個看詳細</small></h2>
          <div class="filters" id="filters">
            <button data-f="all" class="on">全部</button><button data-f="attn">需處理</button><button data-f="full">已滿</button>
          </div>
        </div>
        <div class="bins" id="bins"></div>
      </section>

      <section class="card">
        <div class="head"><h2>動態派車 <small>只收已滿、快滿或有事件的桶</small></h2></div>
        <div class="form">
          <label>車輛<input id="veh" type="number" value="1" min="1" max="10"></label>
          <label>容量 (L)<input id="cap" type="number" value="2000" step="100"></label>
          <label>預測 (小時)<input id="hz" type="number" value="4" step="0.5"></label>
          <button id="plan">產生路線</button>
        </div>
        <div id="kpi"></div>
        <div id="routes"></div>
      </section>
    </div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/chart.js@4.4.1/dist/chart.umd.js"></script>
<script>
const C={available:'#1f6f4a',near_full:'#c98a00',full:'#c0392b',offline:'#6b7280',fault:'#7c3aed'};
const STATE={available:'有空位',near_full:'快滿',full:'已滿',offline:'離線',fault:'感測被擋'};
const EVT={overflow:'桶滿外溢',illegal_dumping:'違規傾倒',bag_rejected:'拒收垃圾袋',sensor_blocked:'感測器遮擋',
  ground_waste:'地面垃圾',ground_waste_unknown:'地面垃圾',fire_smoke:'煙霧',tamper:'破壞'};
const EVT_HINT={overflow:'桶滿外溢到地面，需加收',illegal_dumping:'桶未滿但有人丟在地上',bag_rejected:'閘門擋下家用垃圾袋',
  sensor_blocked:'超音波被擋住，順路檢查',ground_waste_unknown:'地面有垃圾',fire_smoke:'偵測到煙霧',tamper:'疑似遭破壞'};
const warn=b=>(b.open_events||[]).map(t=>EVT[t]||t).join('、');  // 未處理事件 → 桶要顯示警示
const VCOL=['#2563eb','#db2777','#ea580c','#0891b2','#65a30d'];
let TOKEN=sessionStorage.getItem('adm')||prompt('Admin token');
sessionStorage.setItem('adm',TOKEN);
document.getElementById('logout').onclick=()=>{sessionStorage.removeItem('adm');location.reload()};
const H={'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ?demo=1：現場 Demo 用，每 5 秒更新並把地圖移到 NTNU-01（?bin= 可換桶）；平常 30 秒
const Q=new URLSearchParams(location.search), DEMO=Q.get('demo')==='1'||Q.get('live')==='1', FOCUS=Q.get('bin')||'NTNU-01';
// 預設每秒更新（#49）；?period=秒數 可以自訂
const PERIOD=Math.max(1,+Q.get('period')||1)*1000;
let focused=false;
const ago=t=>{if(t==null)return'-';const s=Math.max(0,Date.now()/1000-t);
  return s<60?`${Math.round(s)} 秒前`:s<3600?`${Math.floor(s/60)} 分前`:new Date(t*1000).toLocaleString()};
const cm=mm=>mm==null?'-':(mm/10).toFixed(1);
const pill=s=>`<span class="pill" style="background:${C[s]||'#999'}">${STATE[s]||esc(s)}</span>`;
const num=v=>v==null?'-':(+v).toFixed(v%1?1:0);

const map=L.map('map').setView([25.0215,121.5310],15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const binLayer=L.layerGroup().addTo(map), routeLayer=L.layerGroup().addTo(map);

let histBin=null, histHours=0.16666667,  // 預設 10 分鐘（#51）
    binsById={}, chart=null, filter='all', lastOk=0;

function renderKpis(bins, openEv){
  const n=s=>bins.filter(b=>b.state===s).length;
  const k=[['垃圾桶',bins.length,'#94a3b8'],['已滿',n('full'),C.full],['快滿',n('near_full'),C.near_full],
    ['未處理事件',openEv,'#ef4444'],['離線／被擋',n('offline')+n('fault'),C.fault]];
  document.getElementById('kpis').innerHTML=k.map(([t,v,c])=>`<div class="kpi" style="border-left-color:${c}"><b>${v}</b><span>${t}</span></div>`).join('');
}
function renderBins(bins){
  const show=bins.filter(b=>filter==='all'||(filter==='full'&&b.state==='full')||
    (filter==='attn'&&(warn(b)||['full','near_full','fault','offline'].includes(b.state))));
  document.getElementById('bins').innerHTML=show.length?show.map(b=>{const w=warn(b), f=b.fill_pct??0;
    return `<button class="bin${w?' warn':''}${b.id===histBin?' sel':''}" data-id="${esc(b.id)}">
      <div class="r1"><b>${w?'⚠ ':''}${esc(b.id)}</b>${pill(b.state)}</div>
      <div class="nm">${esc(b.name)}</div>
      <div class="bar"><i style="width:${f}%;background:${C[b.state]||'#999'}"></i></div>
      <div class="r3"><span><b>${num(b.fill_pct)}</b>%</span><span><b>${b.weight_g==null?'-':(b.weight_g/1000).toFixed(2)}</b> kg</span><span>${ago(b.last_seen)}</span></div>
    </button>`}).join(''):'<div class="empty">沒有符合的桶</div>';
}
async function loadBins(signal){
  const r=await fetch('/api/admin/bins',{headers:H,signal});
  if(!r.ok) return null;  // token 錯誤由 loadEvents 提示並重新登入
  const bins=await r.json();
  if(signal.aborted) return null;
  binsById=Object.fromEntries(bins.map(b=>[b.id,b]));
  if(!histBin) histBin=(bins.find(b=>b.id===FOCUS)||bins[0])?.id||null;
  binLayer.clearLayers();
  if(DEMO&&!focused){
    const f=bins.find(b=>b.id===FOCUS);
    if(f){map.setView([f.lat,f.lng],17);focused=true}
  }
  renderBins(bins);
  bins.forEach(b=>{const w=warn(b), sel=b.id===histBin;
    L.circleMarker([b.lat,b.lng],{radius:sel?13:w?11:8,color:sel?'#111827':w?'#c0392b':'#fff',weight:sel||w?4:2,fillColor:C[b.state],fillOpacity:.95})
      .bindTooltip(`<b>${esc(b.id)}</b> ${esc(b.name)}<br>${STATE[b.state]||esc(b.state)}・${num(b.fill_pct)}%${b.weight_g==null?'':`・${b.weight_g} g`}${w?`<br>⚠ ${esc(w)}`:''}`)
      .on('click',()=>selectBin(b.id)).addTo(binLayer)});
  return bins;
}
async function loadEvents(signal){
  const r=await fetch('/api/events?limit=30',{headers:H,signal});
  if(signal.aborted) return null;
  if(r.status===401){sessionStorage.removeItem('adm');alert('token 錯誤');location.reload();return null}
  if(!r.ok) return null;
  const ev=await r.json();
  if(signal.aborted) return null;

const blockedBands={id:'blockedBands',beforeDatasetsDraw(c){
  const pts=c.$blocked||[], x=c.scales.x, a=c.chartArea; if(!pts.length) return;

function drawHistory(rows){
  const ms=r=>r.ts*1000, pt=f=>rows.map(r=>({x:ms(r),y:f(r)}));
  const bands=[]; let start=null;
  rows.forEach((r,i)=>{if(r.blocked&&start==null) start=ms(r);
    if(start!=null&&(!r.blocked||i===rows.length-1)){bands.push([start,ms(r)]); start=null}});
  const tick=v=>{const d=new Date(v); return histHours>6?`${d.getMonth()+1}/${d.getDate()} ${d.toTimeString().slice(0,5)}`:d.toTimeString().slice(0,5)};
  // X 軸固定「現在往前一個區間」，每秒平順往左捲（#51）
  const xmax=Date.now(), xmin=xmax-histHours*3600e3;
  // 重量、距離軸上限取整數級距，只在資料超出時才放大；換桶或換區間才重設，避免刻度每秒跳
  const key=histBin+'|'+histHours;
  const peak=f=>rows.reduce((m,r)=>{const v=f(r); return v==null?m:Math.max(m,v)},0);
  const nice=v=>{if(v<=0) return 10; const e=10**Math.floor(Math.log10(v)), n=v/e; return (n<=1?1:n<=2?2:n<=5?5:10)*e};
  const sticky=(name,v)=>{const cur=chart?.$key===key?chart.$max?.[name]:0; return Math.max(cur||0, nice(v*1.1))};
  const gmax=sticky('g',peak(r=>r.weight_g)), cmmax=sticky('cm',peak(r=>r.dist_mm==null?null:r.dist_mm/10));
  const data={datasets:[
    {label:'滿度 %',data:pt(r=>r.fill_pct),borderColor:'#1f6f4a',backgroundColor:'rgba(31,111,74,.12)',fill:true,yAxisID:'pct'},
    {label:'重量 g',data:pt(r=>r.weight_g),borderColor:'#c98a00',backgroundColor:'#c98a00',yAxisID:'g',spanGaps:false},
    {label:'距離 cm',data:pt(r=>r.dist_mm==null?null:r.dist_mm/10),borderColor:'#2563eb',backgroundColor:'#2563eb',yAxisID:'cm',borderDash:[5,4]}]};
  data.datasets.forEach(d=>Object.assign(d,{pointRadius:rows.length>30?0:2,borderWidth:2,tension:0}));
  if(!chart){
    chart=new Chart(document.getElementById('hist'),{type:'line',data,plugins:[blockedBands],options:{
      animation:false,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:11}}},
        tooltip:{callbacks:{title:it=>new Date(it[0].parsed.x).toLocaleString(),
          footer:it=>chart.$rows?.[it[0].dataIndex]?.blocked?'感測器遮擋':''}}},
      scales:{x:{type:'linear',ticks:{callback:tick,maxTicksLimit:5,font:{size:10}}},
        pct:{position:'left',min:0,max:100,ticks:{font:{size:10}},title:{display:true,text:'%'}},
        g:{position:'right',beginAtZero:true,ticks:{font:{size:10}},title:{display:true,text:'g'},grid:{drawOnChartArea:false}},
        cm:{position:'right',beginAtZero:true,display:innerWidth>=420,ticks:{font:{size:10}},title:{display:true,text:'cm'},grid:{drawOnChartArea:false}}}}});
  }else{chart.data=data; chart.options.scales.x.ticks.callback=tick}
  const sc=chart.options.scales;
  Object.assign(sc.x,{min:xmin,max:xmax}); sc.x.ticks.stepSize=histHours*3600e3/5; sc.g.max=gmax; sc.cm.max=cmmax;
  chart.$key=key; chart.$max={g:gmax,cm:cmmax};
  chart.$blocked=bands; chart.$rows=rows;
  chart.update('none');
}

function setLive(){

  el.classList.toggle('stale',stale);
  const left=Math.max(0,Math.ceil((nextAt-Date.now())/1000));
  const when=lastOk?new Date(lastOk).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}):'';
  el.innerHTML=`<i></i>${lastOk?(stale?'連線中斷':when):'連線中…'}<b>${poll?'・更新中…':`・${left} 秒後更新`}</b>`;
}
let poll=null, nextAt=0;
async function refresh(){
  if(poll&&!poll.signal.aborted) return;
  nextAt=Date.now()+PERIOD;
  document.getElementById('reload').classList.add('spin');
  const controller=new AbortController();
  poll=controller;
  const timeout=setTimeout(()=>controller.abort(),15000);
  const [b,e]=await Promise.allSettled([loadBins(controller.signal),loadEvents(controller.signal)]);
  if(b.value){renderKpis(b.value, e.value??0); renderFocus(); lastOk=Date.now()}
  if(!controller.signal.aborted) await loadHistory(controller.signal).catch(()=>{});
  if(!controller.signal.aborted) await loadCommands(controller.signal).catch(()=>{});
  if(!controller.signal.aborted) await loadSnapshot(controller.signal).catch(()=>{});
  if(!controller.signal.aborted) await loadStatus(controller.signal).catch(()=>{});
  clearTimeout(timeout);
  if(poll===controller) poll=null;
  nextAt=Date.now()+PERIOD;  // 從更新完成開始倒數
  document.getElementById('reload').classList.remove('spin');
  setLive();
}
document.getElementById('reload').onclick=()=>refresh();

async function resolve(id){

    if(!r.ok) throw new Error(`HTTP ${r.status}`);
  }catch{
    alert('事件處理失敗，請再試一次。');
    return;
  }
  poll?.abort();
  refresh();
}

  const btn=document.getElementById('plan'); btn.disabled=true; btn.textContent='計算中…';
  try{
    const body={vehicles:+veh.value,vehicle_capacity_l:+cap.value,horizon_h:+hz.value};
    const r=await fetch('/api/dispatch/plan',{method:'POST',headers:H,body:JSON.stringify(body)});
    if(!r.ok){alert(await r.text());return}
    const p=await r.json();
    routeLayer.clearLayers();
    L.marker([p.depot.lat,p.depot.lng]).bindTooltip('清潔隊').addTo(routeLayer);
    const stops=p.routes.reduce((n,x)=>n+x.path.length-2,0);
    document.getElementById('kpi').innerHTML=`<div class="routekpi"><div><b>${(p.total_m/1000).toFixed(1)} km</b><span>動態路線</span></div>
      <div><b>${(p.baseline_m/1000).toFixed(1)} km</b><span>固定排程</span></div>
      <div><b style="color:var(--g)">${p.saving_pct}%</b><span>節省・${stops} 站</span></div></div>`;
    document.getElementById('routes').innerHTML=p.routes.map(rt=>`<p style="margin:10px 0 0;font-size:13px;color:${VCOL[rt.vehicle%5]}">
      <b>車 ${rt.vehicle+1}</b>・${(rt.distance_m/1000).toFixed(1)} km・載量約 ${rt.load_l} L</p>
      <ol>${rt.path.filter(s=>!s.depot).map(s=>`<li>${esc(s.name)}<br><small style="color:var(--muted)">${esc(s.reason)}</small></li>`).join('')}</ol>`).join('')
      +(p.skipped.length?`<p class="note">未排入：${p.skipped.join(', ')}</p>`:'');
    p.routes.forEach(rt=>{
      L.polyline(rt.path.map(s=>[s.lat,s.lng]),{color:VCOL[rt.vehicle%5],weight:4,opacity:.85}).addTo(routeLayer);
      rt.path.filter(s=>!s.depot).forEach((s,i)=>L.marker([s.lat,s.lng],{icon:L.divIcon({className:'',
        html:`<div style="background:${VCOL[rt.vehicle%5]};color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;font-size:12px;font-weight:700">${i+1}</div>`})}).addTo(routeLayer));
    });
    if(innerWidth<960) document.getElementById('map').scrollIntoView({behavior:'smooth'});
  }finally{btn.disabled=false; btn.textContent='產生路線'}
};
// 每 250 ms 檢查：時間到就更新，並刷新倒數文字
// 分頁在背景時不更新（省流量、減輕 Pi 負擔），回到前景立刻更新
document.addEventListener('visibilitychange',()=>{if(!document.hidden) refresh()});
refresh();setInterval(()=>{if(!document.hidden&&!poll&&Date.now()>=nextAt) refresh(); setLive()},250);
</script>
</body>
</html>
