name: 測試

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            edge/vision-gate/requirements.txt
      - name: 安裝相依套件
        run: pip install -r backend/requirements.txt -r edge/vision-gate/requirements.txt pytest
      - name: 跑測試
        run: python -m pytest tests -q
