# Demo backend only: HTTP telemetry, no Mosquitto and no MQTT_HOST.
services:
  backend:
    build: ../backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in deploy/.env}
      FULL_WEIGHT_G: ${FULL_WEIGHT_G:-}
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in deploy/.env}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      DEPOT_LAT: "25.0236"
      DEPOT_LNG: "121.5440"
    volumes:
      - smartbin-demo-data:/data
    restart: unless-stopped

volumes:
  smartbin-demo-data:
